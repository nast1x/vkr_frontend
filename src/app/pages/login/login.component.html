<!-- Плавающие логотипы -->
<img src="/assets/images/boy-swimming.png" alt="" class="fixed-logo-left">
<img src="/assets/images/boy-swimming.png" alt="" class="fixed-logo-right">

<!-- Основной контейнер -->
<div class="login-container">

  <!-- Заголовок -->
  <div class="login-header">
    <button class="login-back" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 class="login-title">Авторизация</h1>
  </div>

  <!-- Форма входа -->
  <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">

    <!-- Почта -->
    <div class="login-input-group">
      <label class="login-label">Почта</label>
      <input
        type="email"
        class="login-input"
        [(ngModel)]="email"
        name="email"
        placeholder="example@email.com"
        required
        email
        [disabled]="isLoading"
        >
      </div>

      <!-- Пароль -->
      <div class="login-input-group">
        <label class="login-label">Пароль</label>
        <div class="login-password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="login-input"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required
            [disabled]="isLoading"
            >
            <button
              type="button"
              class="login-password-toggle"
              (click)="togglePassword()"
              tabindex="-1"
              [disabled]="isLoading"
              >
              @if (!showPassword) {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                </svg>
              }
              @if (showPassword) {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12A18.45 18.45 0 0 1 5.06 6.06M9.9 4.24A9.12 9.12 0 0 1 12 4C19 4 23 12 23 12A18.5 18.5 0 0 1 19.73 16.76M14.12 14.12A3 3 0 1 1 9.88 9.88" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              }
            </button>
          </div>
        </div>


        <!-- Сообщение об ошибке -->
        @if (errorMessage) {
          <div class="login-error">
            {{ errorMessage }}
          </div>
        }

        <!-- Кнопка входа -->
        <button
          type="submit"
          class="login-btn-primary"
          [disabled]="!isFormValid() || isLoading"
          >
          @if (isLoading) {
            <span class="login-loading-spinner"></span>
          }
          {{ isLoading ? 'Вход...' : 'Войти' }}
        </button>

      </form>

      <!-- Ссылка на регистрацию -->
      <p class="login-register-text">Нет аккаунта?</p>

      <button type="button" class="login-btn-secondary" (click)="onGoToRegister()">
        Зарегистрироваться
      </button>


    </div>
