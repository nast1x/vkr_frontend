<!-- Шапка сайта -->
<app-header></app-header>

<!-- Основной контент -->
<main class="sports-facilities-content">
  <div class="sports-facilities-container">
    <!-- ЛЕВАЯ КОЛОНКА: Фильтрация -->
    <aside class="sports-facilities-sidebar">
      <div class="filter-block">
        <h3 class="filter-title">Фильтры</h3>
        <!-- Город -->
        <div class="filter-group">
          <label class="filter-label">Город</label>
          <select class="filter-select" [(ngModel)]="selectedCity" (change)="applyFilters()">
            <option value="">Все города</option>
            <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
          </select>
        </div>
        <!-- Кнопка сброса -->
        <button class="filter-reset-btn" (click)="resetFilters()">
          Сбросить фильтры
        </button>
      </div>
    </aside>

    <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА: Список объектов -->
    <section class="sports-facilities-list-section">
      <h1 class="sports-facilities-title">Спортивные объекты</h1>

      <!-- Индикатор загрузки -->
      <div *ngIf="isLoading" class="loading-state">
        <div class="spinner"></div>
        <p>Загрузка данных...</p>
      </div>

      <!-- Сообщение об ошибке -->
      <div *ngIf="error" class="error-state">
        <p>{{ error }}</p>
        <button class="retry-btn" (click)="loadFacilities()">Попробовать снова</button>
      </div>

      <!-- Сетка объектов -->
      <div class="sports-facilities-grid" *ngIf="!isLoading && !error">
        <div
          class="facility-card"
          *ngFor="let facility of filteredFacilities"
        >
          <div class="facility-image-container">
            <img [src]="facility.imageLink" [alt]="facility.name" class="facility-photo">
          </div>
          <div class="facility-info">
            <h2 class="facility-name">{{ facility.name }}</h2>
            <div class="facility-meta">
              <div class="meta-item">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M21 10C21 17 12 23 12 23C12 23 3 17 3 10C3 7.61305 3.94821 5.32387 5.63604 3.63604C7.32387 1.94821 9.61305 1 12 1C14.3869 1 16.6761 1.94821 18.364 3.63604C20.0518 5.32387 21 7.61305 21 10Z" stroke="currentColor" stroke-width="2"/>
                  <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>{{ facility.city }}</span>
              </div>
              <div class="meta-item" *ngIf="facility.sportTypes && facility.sportTypes.trim()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <path d="M3 21H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M5 21V7L12 3L19 7V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>{{ facility.sportTypes }}</span>
              </div>
            </div>
            <p class="facility-description">{{ facility.description }}</p>
            <button class="facility-details-btn" (click)="onViewDetails(facility.idSportFacility)">
              Подробнее
            </button>
          </div>
        </div>

        <!-- Сообщение, если ничего не найдено -->
        <div *ngIf="filteredFacilities.length === 0" class="no-results">
          <p>По выбранным фильтрам объекты не найдены.</p>
        </div>
      </div>
    </section>

    <!-- ПРАВАЯ КОЛОНКА: Декоративная картинка -->
    <aside class="sports-facilities-decor">
      <img src="/assets/images/mountain-biking.png" alt="Mountain Biking" class="decor-image">
    </aside>
  </div>
</main>
